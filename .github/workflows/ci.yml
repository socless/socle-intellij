name: CI

# Unit and platform tests, plugin verification and the plugin zip (bundling the
# pinned Socle server), on pull requests and by hand.
on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - name: Test, verify and build
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./gradlew test verifyPlugin buildPlugin
