# The plugin's version (a v<version> tag releases it).
pluginVersion = 0.2.0

# The IDE the plugin builds and runs against, and the oldest build it installs on.
platformVersion = 2026.2.3
pluginSinceBuild = 262

# Plugins Socle depends on (JetBrains Marketplace versions for the platform above).
scalaPluginVersion = 2026.2.21
lsp4ijVersion = 0.21.0

# The bundled language server: a socle release and the sha256 of its socle-lsp jar (from its SHA256SUMS).
# SOCLE_LSP_JAR (environment) replaces it with a local jar, without a hash check.
socleVersion = 0.26.0
socleLspSha256 = 1865c5575c1fd33a5227ca3eccb435d3add6c3d0dc5914f31d3d8375b414ef85

kotlin.stdlib.default.dependency = false
org.gradle.configuration-cache = true
org.gradle.caching = true
